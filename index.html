<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GroceryKit — Know the Price Before You Reach the Shop</title>
<meta name="description" content="GroceryKit is a weekly grocery planner for Bengaluru: indicative prices at DMart, BigBasket and your local kirana, aisle shelves, a tick-off shopping list, pantry stock, price watch and a spend log — all on your device.">
<meta name="theme-color" content="#2b1d12">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232b1d12'/%3E%3Cpath d='M16 26h32l-4 24a4 4 0 0 1-4 3H24a4 4 0 0 1-4-3l-4-24z' fill='none' stroke='%23d9a441' stroke-width='4' stroke-linejoin='round'/%3E%3Cpath d='M24 26v-3a8 8 0 0 1 16 0v3' fill='none' stroke='%23d9a441' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --paper:#f7f1e5; --paper2:#efe5d0; --card:#fffdf7; --ink:#2b1d12; --ink2:#5d4c3a;
  --mut:#8a7661; --line:#e5d8c2; --bronze:#b4762a; --amber:#d9a441; --gold:#e8b64c;
  --terra:#c05b2e; --terra-d:#9c4520; --green:#4a7a4f; --greenbg:#e9f1e4;
  --red:#a83a22; --redbg:#fbe9e2; --watch:#9a6a14; --watchbg:#fdf3d7;
  --okbg:#eef4ea; --r:18px; --sh:0 10px 30px rgba(43,29,18,.10);
  --sh2:0 22px 55px rgba(43,29,18,.16);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,.serif{font-family:Fraunces,Georgia,serif;font-weight:600;letter-spacing:-.01em}
img{max-width:100%;display:block}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--ink)}
a{color:var(--terra)}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px;border-radius:6px}
.wrap{max-width:1060px;margin:0 auto;padding:0 20px}
.muted{color:var(--mut)}
.small{font-size:13px}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--bronze)}
/* ---------- cinematic intro ---------- */
#intro{position:fixed;inset:0;z-index:200;background:linear-gradient(160deg,#241a10 0%,#3a2a18 55%,#6b4423 100%);color:#f7ead2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;cursor:pointer;overflow:hidden}
#intro .rays{position:absolute;inset:-40%;background:conic-gradient(from 0deg,transparent 0 18deg,rgba(232,182,76,.10) 18deg 26deg,transparent 26deg 60deg,rgba(232,182,76,.07) 60deg 68deg,transparent 68deg 360deg);animation:spin 26s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#intro .mark{width:92px;height:92px;border-radius:24px;background:#f7ead2;display:grid;place-items:center;box-shadow:0 0 0 1px rgba(232,182,76,.5),0 18px 50px rgba(0,0,0,.45);animation:markIn .9s cubic-bezier(.2,.9,.25,1.2) both}
@keyframes markIn{from{transform:scale(.4) rotate(-14deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
#intro h1{font-size:clamp(40px,9vw,72px);line-height:1;margin-top:26px;animation:rise .8s .35s cubic-bezier(.2,.8,.2,1) both}
#intro h1 span{color:var(--gold)}
#intro .tag{margin-top:12px;font-size:clamp(15px,2.6vw,19px);color:#e6cfa4;animation:rise .8s .55s cubic-bezier(.2,.8,.2,1) both}
#intro .bar{width:min(280px,70vw);height:4px;border-radius:99px;background:rgba(247,234,210,.25);margin-top:34px;overflow:hidden;animation:rise .8s .7s both}
#intro .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--terra));border-radius:99px;animation:fill 3.4s .7s ease forwards}
@keyframes fill{to{width:100%}}
#intro .skip{position:absolute;bottom:26px;right:26px;background:rgba(247,234,210,.14);border:1px solid rgba(247,234,210,.4);color:#f7ead2;padding:9px 16px;border-radius:99px;font-size:13px;font-weight:700}
@keyframes rise{from{transform:translateY(18px);opacity:0}to{transform:translateY(0);opacity:1}}
#intro.gone{display:none}
/* ---------- header ---------- */
header.top{position:sticky;top:0;z-index:60;background:rgba(247,241,229,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:14px;padding:13px 0}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.logo .lg{width:40px;height:40px;border-radius:12px;background:var(--ink);display:grid;place-items:center;flex:none}
.logo b{font-family:Fraunces,serif;font-size:22px;letter-spacing:-.01em}
.logo small{display:block;font-size:10px;letter-spacing:.18em;color:var(--bronze);font-weight:800;text-transform:uppercase;margin-top:-3px}
.top nav{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap}
.top nav a{color:var(--ink2);text-decoration:none;font-size:13.5px;font-weight:600;padding:8px 11px;border-radius:99px}
.top nav a:hover{background:var(--paper2);color:var(--ink)}
/* ---------- hero ---------- */
.hero{position:relative;border-radius:0 0 28px 28px;overflow:hidden;background:#3a2a18}
.hero img.ph{width:100%;height:min(58vw,430px);object-fit:cover;object-position:center 38%;animation:kb 26s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1) translateY(0)}to{transform:scale(1.08) translateY(-8px)}}
.hero .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(28,19,10,.18) 0%,rgba(28,19,10,0) 42%,rgba(28,19,10,.72) 100%)}
.hero .copy{position:absolute;left:0;right:0;bottom:0;padding:26px 22px 30px;color:#fdf6e7}
.hero .copy h1{font-size:clamp(34px,6.4vw,58px);line-height:1.04;max-width:640px}
.hero .copy h1 em{color:var(--gold);font-style:normal}
.hero .copy p{margin-top:10px;max-width:560px;color:#f2e3c8;font-size:clamp(14.5px,2.4vw,17px)}
.hero .disc{margin-top:12px;font-size:12.5px;color:#e8d5ae;opacity:.92}
/* ---------- basket card overlapping hero ---------- */
.basket-card{position:relative;z-index:2;margin-top:-64px;background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--sh2);padding:22px}
.basket-top{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
.basket-main{flex:1;min-width:240px}
.basket-main h2{font-size:clamp(21px,3.4vw,27px);line-height:1.15}
.basket-main .sub{color:var(--mut);font-size:13.5px;margin-top:3px}
.basket-total{font-family:Fraunces,serif;font-size:clamp(38px,7vw,52px);font-weight:700;line-height:1;margin-top:10px}
.basket-total small{font-size:15px;font-family:Inter,sans-serif;font-weight:600;color:var(--mut)}
.cheap-call{margin-top:10px;display:inline-flex;gap:8px;align-items:center;background:var(--okbg);color:#2f5233;border-radius:99px;padding:8px 14px;font-size:13.5px;font-weight:700}
.cheap-call b{color:var(--terra)}
.budget-edit{margin-top:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13.5px;color:var(--ink2)}
.budget-edit label{font-weight:700}
.budget-edit input{width:110px;background:#fffdf7;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-weight:700}
.ringwrap{display:flex;flex-direction:column;align-items:center;gap:6px;margin-left:auto}
.ring{position:relative;width:112px;height:112px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .rv2{position:absolute;inset:0;display:grid;place-items:center;font-family:Fraunces,serif;font-weight:700;font-size:24px}
.ring .rv2 small{font-size:12px;font-family:Inter,sans-serif;font-weight:600;color:var(--mut);display:block;text-align:center}
.ring-cap{font-size:12.5px;font-weight:700;color:var(--mut);text-align:center;max-width:130px}
.basket-foot{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;align-items:center}
.btn{border:1px solid var(--ink);background:var(--ink);color:#fdf6e7;font-weight:700;font-size:14px;padding:11px 18px;border-radius:99px;display:inline-flex;align-items:center;gap:8px;text-decoration:none}
.btn:hover{background:#3d2d1d}
.btn.ghost{background:transparent;color:var(--ink);border-color:#cbb894}
.btn.ghost:hover{background:var(--paper2)}
.btn.terra{background:var(--terra);border-color:var(--terra)}
.btn.terra:hover{background:var(--terra-d)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:99px;font-size:12.5px;font-weight:800;letter-spacing:.02em}
.pill.warn{background:var(--watchbg);color:var(--watch)}
.pill.ok{background:var(--okbg);color:var(--green)}
.pill.bad{background:var(--redbg);color:var(--red)}

/* ---------- sections ---------- */
section.block{margin-top:44px}
.sec-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.sec-head h2{font-size:clamp(24px,4vw,32px)}
.sec-head .count{margin-left:auto;font-size:13px;font-weight:700;color:var(--mut)}
.sec-sub{color:var(--mut);font-size:14.5px;max-width:640px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
/* ---------- store picker ---------- */
.stores{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.store{padding:18px;text-align:left;position:relative}
.store:hover{border-color:var(--bronze)}
.store.on{border:2px solid var(--terra);background:#fff8ef}
.store .s-name{font-family:Fraunces,serif;font-size:19px;font-weight:700}
.store .s-tag{font-size:12.5px;color:var(--mut);margin-top:2px}
.store .s-total{font-family:Fraunces,serif;font-size:24px;font-weight:700;margin-top:8px}
.store .s-total small{font-size:12px;font-family:Inter,sans-serif;font-weight:600;color:var(--mut)}
.store .s-badge{position:absolute;top:-10px;right:12px;background:var(--terra);color:#fdf6e7;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:5px 10px;border-radius:99px}
.store .s-save{font-size:12.5px;font-weight:700;color:var(--green);margin-top:2px}
/* ---------- search ---------- */
.searchrow{display:flex;gap:10px;margin-top:16px}
.searchrow input{flex:1;background:#fffdf7;border:1px solid var(--line);border-radius:99px;padding:12px 18px;font-size:15px}
.searchrow input::placeholder{color:var(--mut)}
/* ---------- aisle rails ---------- */
.aisle{margin-top:26px}
.aisle-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.aisle-head h3{font-size:21px}
.aisle-head .a-tag{font-size:13px;color:var(--mut)}
.aisle-head .a-count{margin-left:auto;font-size:12.5px;font-weight:700;color:var(--mut)}
.rail{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 14px;scroll-snap-type:x mandatory}
.rail::-webkit-scrollbar{height:8px}
.rail::-webkit-scrollbar-thumb{background:#d8c8ab;border-radius:99px}
.item{flex:0 0 208px;scroll-snap-align:start;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh);cursor:pointer;text-align:left;display:flex;flex-direction:column}
.item:hover{border-color:var(--bronze)}
.item.in-list{border-color:var(--terra);box-shadow:0 0 0 1px var(--terra),var(--sh)}
.item h4{font-size:16.5px;line-height:1.25;font-family:Fraunces,serif;font-weight:600}
